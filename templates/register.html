{% extends "base.html" %}{% block content %}<form class="box" method="post"><h2>สมัครสมาชิก</h2>
<p class="mut" style="margin-top:0">ช่องที่มี * ต้องกรอกให้ครบจึงจะสมัครได้</p>
<label>ชื่อผู้ใช้ *</label><input name="username" value="{{ f.username }}" required>
<label>อีเมล (Gmail) * </label><input name="email" type="email" value="{{ f.email }}" required pattern="[A-Za-z0-9._%+\-]+@gmail\.com" title="ต้องเป็น Gmail เช่น name@gmail.com" placeholder="name@gmail.com">
<label>รหัสผ่าน * (6 ตัวขึ้นไป)</label><input name="password" type="password" required pattern="(?=.*[a-z])(?=.*[A-Z]).{6,}" title="อย่างน้อย 6 ตัว และมีตัวพิมพ์ใหญ่และพิมพ์เล็ก">
<p class="mut" style="font-size:13px;margin:6px 0 0">ต้องมีตัวพิมพ์ใหญ่และตัวพิมพ์เล็กอย่างน้อยอย่างละ 1 ตัว ตัวเลขใส่กี่ตัวก็ได้</p>
<label>ชื่อ-นามสกุล *</label><input name="full_name" value="{{ f.full_name }}" required>
<label>เบอร์โทร * (ตัวเลขเท่านั้น 9-10 หลัก)</label><input name="phone" value="{{ f.phone }}" required inputmode="numeric" pattern="[0-9]{9,10}" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')" title="ตัวเลข 9-10 หลักเท่านั้น">
<label>ที่อยู่จัดส่ง </label><textarea name="address" rows="3">{{ f.address }}</textarea>
<p><button class="btn ac">สมัครสมาชิก</button></p></form>{% endblock %}
